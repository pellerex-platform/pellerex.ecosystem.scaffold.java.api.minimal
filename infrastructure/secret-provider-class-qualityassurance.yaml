apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: RepoUniqueNormalisedIdentifier-api-vault
  namespace: <qualityassurance-namespace>
spec:
  provider: azure
  # No secretObjects block — the tmpfs FILE MOUNT is the only consumer (JV-D6 / JV-R13).
  # Spring reads it via configtree:; nothing is synced into a Kubernetes Secret / etcd / env.
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<identity-id>"
    keyvaultName: "<qualityassurance-keyvault-name>"
    cloudName: ""
    cloudEnvFileName: ""
    objects: |
      array:
        - |
          objectName: DbConnectionString
          objectAlias: DbConnectionString
          objectType: secret
          objectVersion: ""

    tenantId: "<tenant-id>"
