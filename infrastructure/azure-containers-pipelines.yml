trigger:
  - <target-branch>

# Named ubuntu-24.04 rather than ubuntu-latest, like the GitHub build in
# .github/workflows/ci.yaml, until this build has been proven on Ubuntu 26.
pool:
  vmImage: "ubuntu-24.04"

variables:
  - group: PipelineVariables
  - name: projectName
    value: "Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier"
  - name: dockerRepositoryName
    value: "pellerex/RepoUniqueNormalisedIdentifier"

steps:
  - checkout: self
    lfs: true

  # The unit tests run in the Dockerfile's unit-tests stage, as in the GitHub build. Their
  # results and coverage are kept as the test-coverage artifact, which Pellerex reads after
  # the build for the app's Test Coverage tab. The build stops after the upload when a test
  # failed, so a build with a failing test publishes nothing.
  - script: docker buildx build --target unit-test-results --output type=local,dest=$(Agent.TempDirectory)/unit-test-results .
    displayName: "Run unit tests"

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: "$(Agent.TempDirectory)/unit-test-results/test-coverage"
      artifactName: "test-coverage"
    displayName: "Upload test coverage"

  - script: grep -qx 0 "$(Agent.TempDirectory)/unit-test-results/unit-tests-exit-code"
    displayName: "Stop when a unit test failed"

  # Build + OWASP dependency-check gate (JV-D20 / J8 / J11). The unit tests ran in the
  # steps above, so this step skips them.
  # dependency-check:check is bound to the `verify` phase, so `mvn verify` runs it.
  - script: |
      export JAVA_HOME=$(JAVA_HOME_21_X64)
      mvn -B -ntp verify -Dmaven.test.skip=true
    displayName: "Maven verify + OWASP dependency-check"
    env:
      NVD_API_KEY: $(NVD_API_KEY)

  # Publish the infrastructure folder (Helm chart, values, secret-provider-classes) so
  # ReleaseProcess can run `helm upgrade` against it — identical to the other languages.
  - task: CopyFiles@2
    inputs:
      SourceFolder: "infrastructure"
      Contents: "**"
      TargetFolder: "$(Build.ArtifactStagingDirectory)"

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "$(projectName)"
    displayName: "Upload Artifacts"

  # Multi-stage build → DockerHub pellerex/<repo> (JV-D8). The image's own build stage
  # compiles the layered jar and copies the App Insights agent (J5/J6).
  # The image is also tagged with the full commit it was built from, so a release can
  # deploy this build by its own tag and a pod that restarts pulls that same image again,
  # never a newer build. latest and v1.0.0 are still pushed as before.
  - task: Docker@2
    inputs:
      repository: "$(dockerRepositoryName)"
      command: "build"
      Dockerfile: "**/Dockerfile"
      tags: |
        $(Build.SourceVersion)
        latest
        v1.0.0

  # Only the target branch pushes. On every other branch this step is left out of the
  # pipeline, so a run there never asks for the DockerHub connection, which Azure DevOps gives
  # to the target branch alone.
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/<target-branch>') }}:
    - task: Docker@2
      displayName: Push
      inputs:
        command: push
        containerRegistry: "DockerHub"
        repository: "$(dockerRepositoryName)"
        tags: |
          $(Build.SourceVersion)
          latest
          v1.0.0
