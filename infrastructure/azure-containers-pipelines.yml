trigger:
  - <target-branch>

# Named ubuntu-24.04 rather than ubuntu-latest, like the GitHub build in
# .github/workflows/ci.yaml, until this build has been proven on Ubuntu 26.
pool:
  vmImage: "ubuntu-24.04"

variables:
  - group: PipelineVariables
  - name: projectName
    value: "Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier"
  - name: dockerRepositoryName
    value: "pellerex/RepoUniqueNormalisedIdentifier"

steps:
  - checkout: self
    lfs: true

  # Build + unit tests + OWASP dependency-check gate (JV-D20 / J8 / J11).
  # dependency-check:check is bound to the `verify` phase, so `mvn verify` runs it.
  - script: |
      export JAVA_HOME=$(JAVA_HOME_21_X64)
      mvn -B -ntp verify
    displayName: "Maven verify + OWASP dependency-check"
    env:
      NVD_API_KEY: $(NVD_API_KEY)

  # Publish the infrastructure folder (Helm chart, values, secret-provider-classes) so
  # ReleaseProcess can run `helm upgrade` against it — identical to the other languages.
  - task: CopyFiles@2
    inputs:
      SourceFolder: "infrastructure"
      Contents: "**"
      TargetFolder: "$(Build.ArtifactStagingDirectory)"

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "$(projectName)"
    displayName: "Upload Artifacts"

  # Multi-stage build → DockerHub pellerex/<repo> (JV-D8). The image's own build stage
  # compiles the layered jar and copies the App Insights agent (J5/J6).
  - task: Docker@2
    inputs:
      repository: "$(dockerRepositoryName)"
      command: "build"
      Dockerfile: "**/Dockerfile"
      tags: |
        latest
        v1.0.0

  # Only the target branch pushes. On every other branch this step is left out of the
  # pipeline, so a run there never asks for the DockerHub connection, which Azure DevOps gives
  # to the target branch alone.
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/<target-branch>') }}:
    - task: Docker@2
      displayName: Push
      inputs:
        command: push
        containerRegistry: "DockerHub"
        repository: "$(dockerRepositoryName)"
        tags: |
          latest
          v1.0.0
